<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}YT Shorts Automation{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">YT Shorts Automation</div>
      <nav>
        <a href="{{ url_for('index') }}" class="{{ 'active' if request.endpoint == 'index' else '' }}">Dashboard</a>
        <a href="{{ url_for('topics.list_topics') }}" class="{{ 'active' if request.blueprint == 'topics' else '' }}">Topics</a>
        <a href="{{ url_for('settings.settings_form') }}" class="{{ 'active' if request.blueprint == 'settings' else '' }}">Settings</a>
        <a href="{{ url_for('shorts.list_shorts') }}" class="{{ 'active' if request.blueprint == 'shorts' else '' }}">Shorts</a>
        <a href="{{ url_for('youtube_account.status') }}" class="{{ 'active' if request.blueprint == 'youtube_account' else '' }}">YouTube</a>
      </nav>
    </aside>
    <main class="content">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>

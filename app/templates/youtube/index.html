{% extends "base.html" %}
{% block title %}YouTube - YT Shorts Automation{% endblock %}
{% block content %}
  <div class="page-header">
    <h1>YouTube</h1>
  </div>

  <div class="card">
    <h2>Connection</h2>
    {% if account %}
      <span class="pill pill-ok">connected</span>
      <p>{{ account.channel_name or account.channel_id }}</p>
    {% else %}
      <span class="pill pill-warn">not connected</span>
      <p>Connect flow lands in Phase 3.</p>
      <button class="btn" disabled title="Wired up in Phase 3">Connect</button>
    {% endif %}
  </div>
{% endblock %}

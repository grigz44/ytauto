name: Supabase Keep-Alive

on:
  schedule:
    # Every Monday at 06:00 UTC. Independent of the daily pipeline so the
    # database never pauses even if that workflow is disabled or failing.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install psycopg2-binary

      - run: python scripts/keepalive.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
